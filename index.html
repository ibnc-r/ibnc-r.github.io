<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ibnc-r · রাজশাহী | aesthetic landing</title>
  <!-- only essential: Inter font + minimal icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #03050a;
      color: #eef3fc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- animated background (ethereal, slow) ---------- */
    .bg-orb {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: breathe 18s infinite alternate ease-in-out;
    }

    .orb1 {
      width: 60vmin;
      height: 60vmin;
      background: rgba(70, 140, 255, 0.25);
      top: -10%;
      left: -5%;
      animation-duration: 22s;
    }

    .orb2 {
      width: 75vmin;
      height: 75vmin;
      background: rgba(180, 130, 255, 0.2);
      bottom: -15%;
      right: -5%;
      animation-duration: 26s;
      animation-delay: -3s;
    }

    .orb3 {
      width: 45vmin;
      height: 45vmin;
      background: rgba(255, 200, 150, 0.15);
      top: 30%;
      left: 40%;
      filter: blur(100px);
      animation-duration: 30s;
      animation-delay: -7s;
    }

    @keyframes breathe {
      0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      100% { transform: translate(4%, 6%) scale(1.3); opacity: 0.6; }
    }

    /* subtle moving particles (very light) */
    .particles {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      pointer-events: none;
    }

    /* ---------- main card – ultra minimal, aesthetic glass ---------- */
    .landing {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 860px;
      margin: 2rem;
      padding: 3.5rem 3rem;
      backdrop-filter: blur(14px) saturate(200%);
      -webkit-backdrop-filter: blur(14px) saturate(200%);
      background: rgba(12, 20, 32, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4rem;
      box-shadow: 0 35px 65px -20px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255,255,255,0.08);
      text-align: center;
    }

    /* condensed, elegant spacing */
    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    /* badge – like a whisper */
    .supertitle {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: 300;
      color: #b0ceff;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.4rem 1.2rem;
      border-radius: 100px;
      border: 0.5px solid rgba(255,255,255,0.1);
      margin-bottom: 2rem;
      backdrop-filter: blur(4px);
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 4.4rem);
      font-weight: 550;
      letter-spacing: -0.02em;
      background: linear-gradient(to bottom, #ffffff, #b8d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 20px rgba(60, 120, 255, 0.3);
    }

    .sub {
      font-size: 1.3rem;
      font-weight: 300;
      color: rgba(210, 230, 255, 0.9);
      margin-bottom: 1.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: inline-block;
      padding-bottom: 0.3rem;
    }

    /* college description – very short, poetic */
    .verse {
      font-size: 1.2rem;
      line-height: 1.7;
      font-weight: 300;
      background: rgba(5, 15, 28, 0.3);
      backdrop-filter: blur(4px);
      padding: 2rem 2.2rem;
      border-radius: 3rem;
      border: 1px solid rgba(255,255,255,0.03);
      margin: 2.5rem 0;
      color: #e0ecff;
      box-shadow: 0 10px 25px -15px #00000080;
    }

    .verse i {
      color: #a5c5ff;
      font-size: 1rem;
      opacity: 0.7;
    }

    /* minimal stats / info – just three subtle badges */
    .essence {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem 2.5rem;
      margin: 2.2rem 0 2rem;
      font-size: 1.1rem;
      font-weight: 300;
      color: #cedeff;
    }

    .essence-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      padding: 0.3rem 1.2rem;
      border-radius: 60px;
      border: 0.5px solid rgba(255,255,240,0.05);
      backdrop-filter: blur(5px);
    }

    .essence-item i {
      color: #98bcff;
      font-size: 1.3rem;
    }

    /* single line for github */
    .foot-note {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      color: rgba(200, 220, 255, 0.35);
    }

    .foot-note a {
      color: rgba(190, 215, 255, 0.8);
      text-decoration: none;
      border-bottom: 1px dotted rgba(255,255,255,0.2);
      transition: 0.2s;
    }

    .foot-note a:hover {
      color: white;
      border-bottom-color: #6da5ff;
    }

    /* nothing else — pure minimal */
    hr {
      border: none;
      height: 1px;
      background: rgba(255,255,255,0.05);
      width: 40%;
      margin: 1.8rem auto;
    }

    @media (max-width: 550px) {
      .landing {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
        margin: 1rem;
      }
      .verse {
        padding: 1.5rem;
        font-size: 1rem;
      }
      .essence {
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- animated orbs (only three, very soft) -->
  <div class="bg-orb">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="particles"></div>

  <!-- main minimal card – no student grid, just the soul of the college -->
  <div class="landing">
    <div class="container">
      
      <!-- tiny identifier -->
      <div class="supertitle">
        <i class="fas fa-circle" style="font-size: 0.4rem; color: #8bb5ff; vertical-align: middle; margin-right: 6px;"></i>
        ibnc-r.github.io
      </div>

      <!-- college name – clean & prominent -->
      <h1>islami bank<br>nursing college</h1>
      <div class="sub">রাজশাহী</div>

      <!-- the only descriptive block – short, aesthetic, meaningful -->
      <div class="verse">
        <i class="fas fa-quote-left" style="margin-right: 6px;"></i>
        একটি স্বপ্নের শিক্ষানিকেতন — যেখানে গড়ে ওঠে সেবা ও মানবতার ব্রত নিয়ে নার্সিং পেশাজীবী। আধুনিক শিক্ষা, ইসলামী মূল্যবোধ আর নিবেদনের সমন্বয়।
        <i class="fas fa-quote-right" style="margin-left: 6px; vertical-align: top;"></i>
      </div>

      <!-- three minimalist highlights (no numbers overload) -->
      <div class="essence">
        <span class="essence-item"><i class="fas fa-location-dot"></i> শিরোইল, রাজশাহী</span>
        <span class="essence-item"><i class="fas fa-calendar-alt"></i> প্রতিষ্ঠা ২০০৮</span>
        <span class="essence-item"><i class="fas fa-graduation-cap"></i> অনুমোদিত</span>
      </div>

      <!-- a thin divider for breathing -->
      <hr>

      <!-- footer: only github + small credit -->
      <div class="foot-note">
        <span><i class="far fa-copyright"></i> IBNC, রাজশাহী</span>
        <a href="https://github.com/ibnc-r" target="_blank"><i class="fab fa-github"></i> ibnc-r</a>
        <span>#pure_aesthetic</span>
      </div>

    </div> <!-- /.container -->
  </div> <!-- /.landing -->

  <!-- very light parallax effect for orbs (subtle, doesn't distract) -->
  <script>
    (function() {
      const orbs = document.querySelectorAll('.orb');
      if (orbs.length) {
        document.addEventListener('mousemove', function(e) {
          const x = e.clientX / window.innerWidth;
          const y = e.clientY / window.innerHeight;
          orbs.forEach((orb, idx) => {
            const speed = 8 + idx * 4;
            const moveX = (x - 0.5) * speed;
            const moveY = (y - 0.5) * speed;
            orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
          });
        });
      }
    })();
  </script>
</body>
</html>
