<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Checking Repository...</title>
    <script type="text/javascript">
        async function checkAndRedirect() {
            const username = "ibnc-r";
            const currentPath = window.location.pathname.split('/').filter(Boolean);
            
            if (currentPath.length === 0) {
                window.location.replace("https://ibnc-r.github.io/");
                return;
            }

            const requestedRepo = currentPath[0].toLowerCase();

            try {
                // GitHub API ব্যবহার করে আপনার সব পাবলিক রিপোজিটরি লিস্ট আনা
                const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
                const repos = await response.json();

                // চেক করা হচ্ছে কোনো রিপোজিটরির নাম (ছোট হাতের করলে) ইউজারের রিকোয়েস্টের সাথে মিলে কি না
                const matchedRepo = repos.find(repo => repo.name.toLowerCase() === requestedRepo);

                if (matchedRepo) {
                    // যদি মিল পাওয়া যায়, তবে আসল নামে (যেমন MyNewProject) রিডাইরেক্ট করবে
                    const newPath = [matchedRepo.name, ...currentPath.slice(1)].join('/');
                    const finalUrl = window.location.origin + "/" + newPath + window.location.search + window.location.hash;
                    
                    // লুপ ঠেকানোর জন্য চেক: যদি বর্তমান ইউআরএল আর নতুন ইউআরএল এক না হয় তবেই রিডাইরেক্ট
                    if (window.location.href !== finalUrl) {
                        window.location.replace(finalUrl);
                    } else {
                        showError();
                    }
                } else {
                    // যদি কোনো রিপোজিটরি না মিলে, তবে মেইন সাইটে পাঠাবে
                    window.location.replace("https://ibnc-r.github.io/");
                }
            } catch (error) {
                console.error("API Error:", error);
                window.location.replace("https://ibnc-r.github.io/");
            }
        }

        function showError() {
            document.body.innerHTML = "<h1>404 - Page Not Found</h1><p>Returning to <a href='/'>Home</a>...</p>";
            setTimeout(() => window.location.replace("/"), 3000);
        }

        checkAndRedirect();
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <p>Loading project...</p>
    </div>
</body>
</html>
